# One-time setup helper: generates the Android release keystore and publishes it
# as a downloadable artifact, so you do not need Java installed locally.
#
# Run it once from the Actions tab, then add the four secrets it prints.
# Delete this workflow (or leave it — it is manual-only and harmless).
name: keystore
on:
  workflow_dispatch:
    inputs:
      alias:
        description: Key alias
        default: red
        required: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Generate keystore
        env:
          ALIAS: ${{ inputs.alias }}
        run: |
          # A random password, generated here and printed once. Replace it with
          # your own if you prefer; only these secrets ever need to match.
          PW=$(head -c 32 /dev/urandom | base64 | tr -d '/+=' | head -c 32)
          keytool -genkeypair \
            -keystore red-release.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Red, OU=Mobile, O=Red, L=Jakarta, C=ID"
          base64 -w0 red-release.jks > red-release.jks.base64

          {
            echo "## Add these four repository secrets"
            echo ""
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            echo ""
            echo "| Secret | Value |"
            echo "|---|---|"
            echo "| \`ANDROID_KEYSTORE_BASE64\` | the contents of \`red-release.jks.base64\` (download the artifact) |"
            echo "| \`ANDROID_KEYSTORE_PASSWORD\` | \`$PW\` |"
            echo "| \`ANDROID_KEY_ALIAS\` | \`$ALIAS\` |"
            echo "| \`ANDROID_KEY_PASSWORD\` | \`$PW\` |"
            echo ""
            echo "Keep \`red-release.jks\` somewhere safe. If you lose it you cannot"
            echo "update the app; you would have to publish under a new package name."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: red-release-keystore
          path: red-release.jks.base64
          retention-days: 7
