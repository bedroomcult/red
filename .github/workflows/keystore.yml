# One-time setup helper: generates the Android release keystore and publishes it
# as a downloadable artifact, so you do not need Java installed locally.
#
# Run it once from the Actions tab, then add the four secrets it prints.
# Delete this workflow (or leave it — it is manual-only and harmless).
name: keystore
on:
  workflow_dispatch:
    inputs:
      alias:
        description: Key alias
        default: red
        required: true
      password:
        description: Keystore + key password (leave blank to generate one)
        required: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Generate keystore
        env:
          ALIAS: ${{ inputs.alias }}
          GIVEN_PW: ${{ inputs.password }}
        run: |
          # Use the supplied password when given, so the caller already knows it
          # and does not have to copy it out of the job summary.
          if [ -n "$GIVEN_PW" ]; then
            PW="$GIVEN_PW"
          else
            PW=$(head -c 32 /dev/urandom | base64 | tr -d '/+=' | head -c 32)
          fi
          keytool -genkeypair \
            -keystore red-release.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Red, OU=Mobile, O=Red, L=Jakarta, C=ID"
          base64 -w0 red-release.jks > red-release.jks.base64

          {
            echo "## Keystore generated"
            echo ""
            echo "| Secret | Value |"
            echo "|---|---|"
            echo "| \`ANDROID_KEY_ALIAS\` | \`$ALIAS\` |"
            echo "| \`ANDROID_KEYSTORE_PASSWORD\` | \`$PW\` |"
            echo "| \`ANDROID_KEY_PASSWORD\` | \`$PW\` |"
            echo "| \`ANDROID_KEYSTORE_BASE64\` | the \`red-release.jks.base64\` artifact |"
            echo ""
            echo "Keep the .jks somewhere safe. Losing it means the app can no"
            echo "longer be updated under this package name."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: red-release-keystore
          path: red-release.jks.base64
          retention-days: 7
