name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci && npm run build
      - name: Ensure D1 exists + wire id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e "
          const {execSync}=require('child_process');
          const fs=require('fs');
          let id=null;
          try{
            const list=JSON.parse(execSync('npx wrangler d1 list --json',{encoding:'utf8'})||'[]');
            const found=list.find(d=>d.name==='period-db');
            if(found) id=found.uuid;
          }catch(e){}
          if(!id){
            const out=execSync('npx wrangler d1 create period-db --json',{encoding:'utf8'});
            id=JSON.parse(out).uuid;
          }
          let t=fs.readFileSync('wrangler.toml','utf8');
          t=t.replace(/^database_id = .*$/m,'database_id = \"'+id+'\"');
          fs.writeFileSync('wrangler.toml',t);
          console.log('D1 period-db:',id);
          "
      - run: npx wrangler d1 migrations apply period-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name cycle-tracker
  apk:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm ci && npm run build
      - run: test -d android || npx cap add android
      - run: npx cap sync android
      - run: ./android/gradlew -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cycle-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
