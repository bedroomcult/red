<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
<meta name="theme-color" content="#e5484d" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<title>Period Tracker</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:#fafafa;color:#222}
.wrap{max-width:480px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;text-align:center;color:#888;padding:4px 0}
.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative}
.dnum{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:14px;border:2px solid transparent;cursor:pointer;background:none}
.dnum.dim{color:#bbb}
.dnum.pred-period{border-color:#e5484d}
.dnum.pred-ov{border-color:#30a46c}
.dnum.logged{background:#e5484d;color:#fff;border-color:#e5484d;font-weight:700}
.dot{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:#999}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:12px 0}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer}
button.primary{background:#e5484d;color:#fff;border-color:#e5484d}
.sheet{position:fixed;inset:auto 0 0 0;background:#fff;border-top:1px solid #ddd;border-radius:16px 16px 0 0;padding:16px;box-shadow:0 -4px 24px rgba(0,0,0,.12)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.3)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.err{color:#e5484d;font-size:13px}
.muted{color:#666;font-size:12px}
footer{margin-top:24px;font-size:11px;color:#888}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
